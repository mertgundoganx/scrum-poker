name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For security problems, please don't open an issue: see [SECURITY.md](https://github.com/mertgundoganx/scrum-poker/blob/master/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a room with the T-shirt deck
        2. Join from a second browser
        3. …
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser and device
      placeholder: e.g. Safari 18 on iPhone, Chrome 140 on Windows
    validations:
      required: true
  - type: dropdown
    id: instance
    attributes:
      label: Where
      options: [www.scrumpokerplay.com, My own instance (latest master), My own instance (older version)]
  - type: dropdown
    id: language
    attributes:
      label: Site language
      options: [English, Türkçe, Deutsch, Français, Italiano, العربية, 中文]
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, how often it happens.
